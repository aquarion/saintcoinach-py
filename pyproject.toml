[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saintcoinach"
version = "0.1.0"
description = "Python port of the SaintCoinach FFXIV data-extraction library (data + CLI export)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "WTFPL" }
dependencies = []

[project.optional-dependencies]
# Image/PNG export needs Pillow; pure data reading does not.
images = ["Pillow>=9.0"]

[project.scripts]
saintcoinach = "saintcoinach.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["saintcoinach*"]
