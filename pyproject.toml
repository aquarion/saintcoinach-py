[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saintcoinach"
version = "0.1.0"
description = "Python port of the SaintCoinach FFXIV data-extraction library (data + CLI export)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "WTFPL" }
# PyYAML parses sheet definitions fetched from EXDSchema (or the bundled
# offline fallback) at runtime; platformdirs locates the per-OS cache
# directory those fetched definitions are stored in.
dependencies = ["PyYAML>=6", "platformdirs>=3"]

[project.optional-dependencies]
# Image/PNG export needs Pillow; pure data reading does not. Pillow also
# provides the native BC7 decoder used for BC7 textures (available since 9.2).
# numpy is optional and only accelerates DXT1/3/5 decode (~15-20x); without it,
# decoding falls back to a pure-Python per-pixel implementation.
images = ["Pillow>=9.2", "numpy"]

[project.scripts]
saintcoinach = "saintcoinach.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["saintcoinach*"]

[tool.setuptools.package-data]
"saintcoinach.ex" = ["definitions/*.json"]
